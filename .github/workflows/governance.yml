name: governance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Verifies the real governance records committed in examples/:
      # hash reproduction, review pinning, and the no-self-review invariant.
      - run: python3 tools/verify_lineage.py
